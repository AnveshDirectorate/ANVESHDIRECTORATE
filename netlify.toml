# ANVESH Directorate — Netlify Deployment & Performance Configuration v5.0
[build]
  publish = "."
  functions = "netlify/functions"

# Custom Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Aggressive Immutable Caching for Assets, Audio Sprites, 4K Media & Fonts
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"



# Custom 404 Routing
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
